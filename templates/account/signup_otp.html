<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Registration - FinanceAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .otp-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 32px;
            text-align: center;
            letter-spacing: 0.5em;
            font-weight: 700;
            margin-bottom: 25px;
            transition: border-color 0.3s;
        }
        .otp-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .messages {
            margin-bottom: 20px;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .alert-error { background: #fee; color: #c33; border: 1px solid #fcc; }
        .alert-info { background: #eef; color: #33c; border: 1px solid #ccf; }
        .restart-link {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
        .restart-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>💰 FinanceAI</h1>
        </div>
        <h2>Verify Your Email</h2>
        <p>We've sent a 6-digit code to <strong>{{ email }}</strong>. Enter it below to complete your registration.</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="000000" maxlength="6" pattern="\d{6}" required autofocus class="otp-input">
            <button type="submit" class="btn-primary">Complete Signup</button>
        </form>

        <div class="restart-link">
            <a href="{% url 'accounts:resend_otp' %}" style="display: block; margin-bottom: 10px;">Resend OTP</a>
            Entered the wrong email? <a href="{% url 'account_signup' %}">Restart Signup</a>
        </div>
    </div>
</body>
</html>
